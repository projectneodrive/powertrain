; PlatformIO Project Configuration File — can_utilities
;
; The ESP32 CANSimple control station for the Neodrive powertrain board.
; See README.md for the architecture; the short version is that main.cpp wires
; up setup()/loop() and everything else in src/ is one module per concern.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    ; The project's own include/, for bridge_config.h.
    -I$PROJECT_INCLUDE_DIR

    ; THE IMPORTANT ONE. The firmware's include/ directory, one level up. It
    ; carries the tables that both ends of the CAN bus are generated from:
    ;
    ;   can_ids.h            CANSimple arbitration ids
    ;   can_commands.h       which of them the firmware implements, and which
    ;                        telemetry frames it broadcasts, and how often
    ;   console_commands.h   the serial command set this bridge mirrors
    ;   telemetry_schema.h   the "key=value" channels it re-emits for the GUI
    ;   config/motor_config.h  node id, bit rate, limits, gain defaults
    ;
    ; Without this the bridge is a second, hand-maintained copy of the protocol,
    ; which is precisely how it drifted before (its 'P' meant position while the
    ; board's meant position-PID, and it armed the motor at a 15 A limit against
    ; a firmware configured for 4 A).
    -I$PROJECT_DIR/../include
